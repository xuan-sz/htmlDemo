<div class="content-page active">
    <div class="page-header">
        <h2><i class="fas fa-cog me-2"></i>系统设置</h2>
    </div>
    <div class="stats-card">
        <h5>基本设置</h5>
        <form>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">网站名称</label>
                        <input type="text" class="form-control" value="我的公司">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">联系邮箱</label>
                        <input type="email" class="form-control" value="admin@example.com">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">联系电话</label>
                        <input type="tel" class="form-control" value="400-123-4567">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">时区设置</label>
                        <select class="form-select">
                            <option>Asia/Shanghai</option>
                            <option>UTC</option>
                        </select>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">保存设置</button>
        </form>
    </div>
</div>
